<!-- ============================================
     SEO & META TAGS TEMPLATE FOR BUDGETPRO
     Copy this into the <head> of each calculator page
     ============================================ -->

<!-- PAGE-SPECIFIC: Customize title, description, URL for each page -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Title: Keep under 60 characters, include primary keyword -->
<title>Financial Calculators — Multi-Country | BudgetPro</title>

<!-- Description: Keep under 160 characters, include CTA -->
<meta name="description" content="Free financial calculators across 20 countries. Mortgage, auto, solar, business, construction, and income tools with live local data. Editable & accurate.">

<!-- Keywords: Target global + intent, NOT country-specific -->
<meta name="keywords" content="financial calculator, mortgage calculator, multi-country calculator, international finance tools, solar ROI, business calculator, editable calculator">

<!-- Author & Copyright -->
<meta name="author" content="AI Brains Ventures">
<meta name="copyright" content="© 2026 BudgetPro. All rights reserved.">

<!-- Open Graph (Social Sharing) -->
<meta property="og:title" content="BudgetPro — Global Financial Calculators">
<meta property="og:description" content="Six financial calculators, 20 countries, 100% editable data. Plan your mortgage, business, solar, and more.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://budgetpro.com.ng">
<meta property="og:image" content="https://budgetpro.com.ng/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BudgetPro — Global Financial Calculators">
<meta name="twitter:description" content="Mortgage, solar, business, construction calculators across 20 countries. Editable, local data.">
<meta name="twitter:image" content="https://budgetpro.com.ng/og-image.png">

<!-- Canonical URL (prevent duplicate content) -->
<link rel="canonical" href="https://budgetpro.com.ng/">

<!-- Robots & Crawling -->
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

<!-- Language & Locale -->
<meta name="language" content="English">
<meta property="og:locale" content="en_US">

<!-- Favicon & App Icons -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Preconnect to External Resources (performance) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

<!-- AdSense (preserve existing) -->
<meta name="google-adsense-account" content="ca-pub-2229008759020664">

<!-- ============================================
     STRUCTURED DATA (JSON-LD)
     PAGE-SPECIFIC: Customize per calculator
     ============================================ -->

<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "BudgetPro",
  "url": "https://budgetpro.com.ng",
  "logo": "https://budgetpro.com.ng/logo.png",
  "description": "Global financial calculators for mortgage, auto, solar, business, construction, and income planning.",
  "sameAs": [
    "https://twitter.com/budgetpro",
    "https://www.linkedin.com/company/budgetpro"
  ]
}
</script>

<!-- Website Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "BudgetPro",
  "url": "https://budgetpro.com.ng",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "https://budgetpro.com.ng?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Application Schema (Software) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "BudgetPro",
  "description": "Multi-country financial calculator suite with 20 countries of live local data.",
  "url": "https://budgetpro.com.ng",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Web",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "screenshot": "https://budgetpro.com.ng/screenshot.png"
}
</script>

<!-- Breadcrumb Schema (for homepage) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://budgetpro.com.ng/"
    }
  ]
}
</script>
